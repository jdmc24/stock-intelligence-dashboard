name: ci

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      SEC_USER_AGENT: "stock-intelligence-ci/0.1 (ci@example.com)"
      API_BEARER_TOKEN: "ci-not-used"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile agent modules and smoke scripts
        run: |
          python -m py_compile \
            app/prompts/ask_prompts.py \
            app/services/ask/orchestrator.py \
            app/services/ask/earnings_agent.py \
            app/market_research/service.py \
            app/market_research/prompts.py \
            app/market_research/sources.py \
            scripts/check_agent_routing.py \
            scripts/smoke_agents.py \
            scripts/smoke_claim_check.py \
            scripts/smoke_earnings_drift.py \
            scripts/smoke_market_research.py

      - name: Verify Ask agent routing
        run: python scripts/check_agent_routing.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_BACKEND_URL: "http://127.0.0.1:8000"
      NEXT_PUBLIC_API_BEARER_TOKEN: "ci-not-used"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
